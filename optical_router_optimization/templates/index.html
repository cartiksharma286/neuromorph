<!DOCTYPE html>
<html>
<head>
    <title>OptiMesh 8G - Optical Network Communication Optimization</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #e2e8f0; 
            padding: 40px; 
            margin: 0;
        }
        .container { 
            max-width: 1100px; 
            margin: auto; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 40px; 
            padding-bottom: 20px;
            border-bottom: 1px solid #1e293b;
        }
        .btn { 
            background: linear-gradient(135deg, #0284c7, #0891b2); 
            color: #fff; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .btn:hover { 
            background: linear-gradient(135deg, #0369a1, #0e7490); 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
        }
        .metrics-grid { 
            display: flex; 
            justify-content: space-around; 
            margin-bottom: 30px; 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .metric { 
            text-align: center; 
        }
        .metric-title { 
            font-size: 12px; 
            color: #94a3b8; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .metric-val { 
            font-size: 22px; 
            color: #38bdf8; 
            font-weight: 800; 
        }
        .chart-container { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 4px;
        }
        .loading {
            color: #38bdf8;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="color: #38bdf8; margin-bottom: 10px;">🌐 Relayed Photon-Optic Router Optimization</h1>
            <p style="color: #94a3b8; margin-bottom: 25px;">Pushing wave packets beyond the Huawei Mesh X3 Pro baseline using intermediate 8GHz relay nodes and core optical switches</p>
            <button class="btn" id="sim-btn" onclick="runSim()">PERFORM STATISTICAL WAVE PACKET SIMULATION</button>
            <div id="loading" class="loading">Evaluating photon routing efficiency...</div>
        </div>
        
        <div class="metrics-grid" id="metrics" style="display: none;">
            <!-- Rendered by JS -->
        </div>

        <div class="chart-container" id="chart-area" style="display: none;">
            <img id="sim-plot" src="" alt="Simulation Optimization Plot">
        </div>
    </div>

    <script>
        function runSim() {
            document.getElementById('sim-btn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            fetch('/api/simulate')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('sim-btn').style.display = 'inline-block';
                document.getElementById('sim-btn').innerText = "RE-CALCULATE OPTIMIZATIONS";
                
                document.getElementById('metrics').style.display = 'flex';
                document.getElementById('chart-area').style.display = 'block';
                
                const m = data.metrics;
                document.getElementById('metrics').innerHTML = `
                    <div class="metric"><div class="metric-title">Base Latency (X3 Pro)</div><div class="metric-val" style="color:#ef4444">${m.x3_pro_latency}</div></div>
                    <div class="metric"><div class="metric-title">OptiMesh Latency</div><div class="metric-val" style="color:#10b981">${m.opti_latency}</div></div>
                    <div class="metric"><div class="metric-title">Base Throughput</div><div class="metric-val" style="color:#ef4444">${m.x3_pro_throughput}</div></div>
                    <div class="metric"><div class="metric-title">OptiMesh Throughput</div><div class="metric-val" style="color:#10b981">${m.opti_throughput}</div></div>
                    <div class="metric"><div class="metric-title">Relay Gain</div><div class="metric-val">${m.relay_amplification}</div></div>
                    <div class="metric"><div class="metric-title">Operating Band</div><div class="metric-val">${m.frequency_band}</div></div>
                `;
                
                document.getElementById('sim-plot').src = data.plot;
            });
        }
    </script>
</body>
</html>
